
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download My App</title>
</head>
<body>
  <h1>Thanks for downloading!</h1>
  <p>Your download is starting automatically...</p>

  <img src="preview.png" width="500"
       alt="Application preview">

  <p id="status">Preparing download...</p>
  <a id="manual" href="#">Download manually</a>

  <script>
    const files = {
      windows: "MyApp-Windows.exe",
      linux: "MyApp-Linux.AppImage",
      macos: "MyApp-macOS.dmg"
    };

    const os = new URLSearchParams(
      window.location.search
    ).get("os");

    const file = files[os];

    if (file) {
      const url =
        "https://github.com/Blobu/R.N.Revenge/releases/latest/download/"
        + file;

      document.getElementById("manual").href = url;
      document.getElementById("status").textContent =
        "Downloading " + file;

      window.location.href = url;
    } else {
      document.getElementById("status").textContent =
        "Please select a valid platform.";
    }
  </script>
</body>
</html>
